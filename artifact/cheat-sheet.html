<title>Otoma Account Cheat Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #f7f5ef; --card: #fffdf8; --text: #1b2430; --muted: #5d6671; --faint: #8a919a;
  --line: #e2ddd0; --line-strong: #cfc8b7;
  --teal: #3b6e5e; --teal-strong: #2f5a4c; --teal-soft: #e3ede8; --teal-line: #9fbfb3;
  --rust: #b54834; --rust-soft: #f6e3dd; --focus: #3b6e5e;
  --rail-bg: #1b2430; --rail-text: #ece8de; --rail-muted: #9aa4b0; --rail-line: #2e3a4a;
  --rail-hover: #243041; --rail-teal: #8cc2ae; --rail-rust: #e58b77; --rail-input: #243041;
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14191f; --card: #1b222b; --text: #ebe7dd; --muted: #a1a9b3; --faint: #7a838e;
    --line: #29323d; --line-strong: #3a4552;
    --teal: #74ae98; --teal-strong: #8cc2ae; --teal-soft: #1c302a; --teal-line: #3f6a5b;
    --rust: #df7a64; --rust-soft: #3a231e; --focus: #8cc2ae;
    --rail-bg: #0f141a; --rail-line: #232d39; --rail-hover: #19212b; --rail-input: #19212b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14191f; --card: #1b222b; --text: #ebe7dd; --muted: #a1a9b3; --faint: #7a838e;
  --line: #29323d; --line-strong: #3a4552;
  --teal: #74ae98; --teal-strong: #8cc2ae; --teal-soft: #1c302a; --teal-line: #3f6a5b;
  --rust: #df7a64; --rust-soft: #3a231e; --focus: #8cc2ae;
  --rail-bg: #0f141a; --rail-line: #232d39; --rail-hover: #19212b; --rail-input: #19212b;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid var(--line-strong); color: var(--muted); }
.badge.teal { background: var(--teal-soft); border-color: var(--teal-line); color: var(--teal-strong); }
.badge.rust { background: var(--rust-soft); border-color: transparent; color: var(--rust); }
.pill-btn { font: 500 12px/1 var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
.pill-btn:hover { color: var(--text); }
.on-rail .pill-btn, .pill-btn.on-rail { color: var(--rail-muted); border-color: var(--rail-line); }
.on-rail .pill-btn:hover, .pill-btn.on-rail:hover { color: var(--rail-text); }
.empty { color: var(--muted); font-size: 13px; padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius); margin: 0; }
.notice { padding: 12px 16px; border-radius: var(--radius); background: var(--rust-soft); color: var(--rust); font-size: 13px; margin: 0; }
.notice strong { display: block; margin-bottom: 2px; }
.skeleton { background: var(--line); border-radius: 4px; opacity: 0.7; }
.skel-line { height: 12px; margin-bottom: 10px; }

/* Landing */
.topbar { background: var(--rail-bg); color: var(--rail-text); padding-inline: 16px; }
.topbar-inner { max-width: 1080px; margin: 0 auto; padding-block: 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wordmark { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.wordmark span { color: var(--rail-muted); font-weight: 500; }
.landing { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
.landing h1 { font-size: 30px; margin-bottom: 14px; }
.search { position: relative; margin-bottom: 20px; }
.search input { width: 100%; font: 400 17px/1.3 var(--sans); padding: 13px 110px 13px 42px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--card); color: var(--text); }
.search input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search .pending { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--faint); }
.results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.results { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
.results li + li { border-top: 1px solid var(--line); }
.result { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.2fr) minmax(0, 1.1fr) minmax(0, 1fr) 80px; gap: 12px; align-items: center; padding: 11px 16px; text-decoration: none; }
.result:hover { background: var(--teal-soft); }
.result .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result .cell { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result .when { text-align: right; }
.result .when.stale { color: var(--rust); }

/* Sheet shell */
.sheet { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--rail-bg) 300px, transparent 300px); }
.rail { background: var(--rail-bg); color: var(--rail-text); position: sticky; top: env(safe-area-inset-top, 0px); max-height: 100vh; overflow-y: auto; padding: 20px 22px 28px; display: flex; flex-direction: column; gap: 22px; }
.rail a { color: var(--rail-text); }
.rail .eyebrow { color: var(--rail-muted); }
.rail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
.back { background: none; border: 0; padding: 0; color: var(--rail-muted); cursor: pointer; font-size: 12px; }
.back:hover { color: var(--rail-text); }
.identity h1 { font-size: 27px; line-height: 1.15; font-variation-settings: "opsz" 72; margin: 6px 0 10px; overflow-wrap: anywhere; }
.identity .badges { display: flex; flex-wrap: wrap; gap: 6px; }
.rail .badge { border-color: var(--rail-line); color: var(--rail-muted); }
.rail .badge.teal { background: rgba(140, 194, 174, 0.14); border-color: rgba(140, 194, 174, 0.35); color: var(--rail-teal); }
.rail .badge.rust { background: rgba(229, 139, 119, 0.15); color: var(--rail-rust); }
.rail .skeleton { background: var(--rail-line); }
.facts { margin: 8px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; row-gap: 7px; font-size: 13px; }
.facts dt { color: var(--rail-muted); }
.facts dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.facts dd.none { color: var(--rail-muted); opacity: 0.6; }
.drawer-toggle { display: none; }
.drawer-body { display: flex; flex-direction: column; gap: 22px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.link-btn { background: none; border: 0; padding: 0; cursor: pointer; font-size: 12px; color: var(--rail-teal); }
.link-btn:hover { text-decoration: underline; }
.resources { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.resource { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 9px; margin: 0 -9px; border-radius: 4px; font-size: 13px; text-decoration: none; }
a.resource:hover { background: var(--rail-hover); }
a.resource .arrow { color: var(--rail-teal); }
.resource.pending { color: var(--rail-muted); }
.resource .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; border: 1px dashed var(--rail-line); border-radius: 3px; padding: 1px 6px; white-space: nowrap; }
.rail-note { font-size: 12px; color: var(--rail-muted); margin: 8px 0 0; }
.editor { margin-top: 10px; display: grid; gap: 8px; }
.editor label { font-size: 11px; color: var(--rail-muted); display: grid; gap: 4px; }
.editor select, .editor input { width: 100%; font: 13px var(--sans); color: var(--rail-text); background: var(--rail-input); border: 1px solid var(--rail-line); border-radius: 4px; padding: 6px 8px; }
.editor .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px; padding: 8px; border: 1px solid var(--rail-line); border-radius: 4px; }
.editor .row input + input { margin-top: 4px; }
.editor .remove { background: none; border: 0; color: var(--rail-muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; align-self: start; }
.editor .remove:hover { color: var(--rail-rust); }
.editor .actions { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.editor .primary { background: var(--rail-teal); color: var(--rail-bg); border: 0; border-radius: 4px; padding: 6px 12px; font-weight: 600; font-size: 12px; cursor: pointer; }
.editor .primary:disabled { opacity: 0.5; cursor: wait; }
.editor .err { color: var(--rail-rust); font-size: 12px; }
.rail-foot { margin-top: auto; font-size: 11px; color: var(--rail-muted); line-height: 1.6; }

.main { padding: 22px 32px 64px; max-width: 1240px; width: 100%; }
.main-top { display: flex; justify-content: flex-end; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
.live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); margin-right: 6px; vertical-align: 1px; }
.panel { margin-bottom: 30px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line-strong); padding-bottom: 7px; margin-bottom: 14px; }
.panel-head h2 { font-size: 20px; }
.panel-head .meta { font-size: 12px; color: var(--muted); }
.snapshot { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 26px; }
.snapshot h3 { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
.prose { font-size: 15px; line-height: 1.6; max-width: 68ch; }
.prose p, .prose ul, .prose ol { margin: 0 0 10px; }
.prose ul, .prose ol { padding-left: 20px; }
.prose li { margin-bottom: 3px; }
.prose li::marker { color: var(--teal); }
.prose strong { font-weight: 600; }
.callouts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.callouts:empty { display: none; }
.callout { display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 12px; border-radius: var(--radius); font-size: 13px; font-weight: 500; background: var(--teal-soft); color: var(--teal-strong); }
.callout strong { font-family: var(--serif); font-size: 16px; }
.callout.rust { background: var(--rust-soft); color: var(--rust); }

.contacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.contact { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 40px 12px 14px; min-width: 0; }
.contact.primary { border-color: var(--teal); background: var(--teal-soft); box-shadow: inset 3px 0 0 var(--teal); }
.contact .cname { font-weight: 600; }
.contact .ctitle { color: var(--muted); font-size: 13px; margin-top: 1px; }
.contact .links { margin-top: 8px; font-size: 13px; display: grid; gap: 2px; }
.contact .links a { color: var(--teal-strong); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; }
.contact .links a:hover { text-decoration: underline; }
.contact .links .missing { color: var(--faint); }
.pin { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 4px; background: transparent; color: var(--faint); font-size: 17px; line-height: 1; cursor: pointer; }
.pin:hover:not(:disabled) { background: var(--line); color: var(--text); }
.pin[aria-pressed="true"] { color: var(--teal); }
.pin:disabled { cursor: not-allowed; opacity: 0.45; }
.primary-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--teal-strong); margin-bottom: 2px; }
.hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.error-inline { color: var(--rust); font-size: 12px; margin: 8px 0 0; }

.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 36px; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line-strong); }
.tl-item { position: relative; padding: 0 0 14px 24px; }
.tl-item::before { content: ""; position: absolute; left: 0; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line-strong); }
.tl-item.done::before { background: var(--teal); border-color: var(--teal); }
.tl-item.open::before { border-color: var(--teal); }
.tl-item.upcoming::before { border-color: var(--teal); background: var(--teal-soft); }
.tl-item.overdue::before { border-color: var(--rust); }
.tl-date { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.tl-subject { font-weight: 500; margin: 1px 0 2px; overflow-wrap: anywhere; }
.tl-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.tl-meta .s-open { color: var(--teal-strong); font-weight: 500; }
.tl-meta .s-overdue { color: var(--rust); font-weight: 600; }
.tl-divider { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 2px 0 12px 24px; }
.show-more { margin: 4px 0 0 24px; font: 500 13px var(--sans); color: var(--teal-strong); background: none; border: 0; padding: 4px 0; cursor: pointer; }
.news-links { display: grid; gap: 8px; }
.news-link { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); text-decoration: none; }
.news-link:hover { border-color: var(--teal-line); background: var(--teal-soft); }
.news-link .nl-title { font-weight: 500; }
.news-link .nl-sub { font-size: 12px; color: var(--muted); }
.news-link .arrow { color: var(--teal); }


/* Home dashboard */
.landing { max-width: 1240px; }
.dash-head { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin: -4px 0 12px; }
.dash-head .meta { font-size: 12px; color: var(--muted); }
.dash { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.dash-side { display: flex; flex-direction: column; }
.acct-link { font-weight: 600; text-decoration: none; color: var(--text); }
.acct-link:hover { color: var(--teal-strong); text-decoration: underline; }
.stage-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
.stage-strip:empty { display: none; }
.stage-chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); }
.stage-chip strong { color: var(--text); font-weight: 600; }
.stage-chip.teal { background: var(--teal-soft); border-color: var(--teal-line); color: var(--teal-strong); }
.stage-chip.teal strong { color: var(--teal-strong); }
.opp-list, .due-list, .recent-list { list-style: none; margin: 0; padding: 0; }
.opp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.opp:first-child { padding-top: 0; }
.opp-acct { font-size: 15px; }
.opp-name { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.opp-next { font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.opp-next-label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.opp-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; text-align: right; }
.opp-close { font-size: 12px; color: var(--muted); }
.opp-close.soon { color: var(--teal-strong); font-weight: 500; }
.opp-close.late { color: var(--rust); font-weight: 500; }
.due-group + .due-group { margin-top: 14px; }
.due-label { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
.due-label.rust { color: var(--rust); }
.due { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.due-date { font-size: 12px; color: var(--muted); padding-top: 1px; }
.due.overdue .due-date { color: var(--rust); font-weight: 600; }
.due-body { display: flex; flex-direction: column; min-width: 0; }
.due-subject { font-weight: 500; overflow-wrap: anywhere; }
.due-meta { font-size: 12px; color: var(--muted); }
.due-meta .acct-link { font-weight: 500; color: var(--muted); }
.recent { padding: 8px 0; border-bottom: 1px solid var(--line); }
.recent-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.recent-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
.recent-count.dense { color: var(--teal-strong); font-weight: 600; }
.recent-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Cheat sheet: opportunities + outreach */
.sheet-opps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.sheet-opp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.outreach-box { border: 1px solid var(--teal-line); border-radius: var(--radius); background: var(--card); padding: 16px 18px; }
.outreach-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 600 13px var(--sans); border-radius: 4px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--teal); background: var(--teal); color: var(--card); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.ghost { background: transparent; color: var(--teal-strong); }
.outreach-stream { white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: var(--text); margin-top: 12px; }
.outreach-thinking { color: var(--muted); font-size: 13px; margin-top: 12px; }
.outreach-sections { display: grid; gap: 16px; margin-top: 14px; }
.outreach-sections h3 { font: 600 11px/1.2 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--teal-strong); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.email-draft { font-size: 14px; line-height: 1.6; white-space: pre-wrap; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; max-width: 72ch; }
.copy-btn { font: 500 12px var(--sans); text-transform: none; letter-spacing: 0; background: none; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 10px; color: var(--muted); cursor: pointer; }
.copy-btn:hover { color: var(--text); }
.context-edit { display: grid; gap: 6px; margin-top: 12px; }
.context-edit textarea { width: 100%; min-height: 70px; font: 13px/1.5 var(--sans); color: var(--text); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 4px; padding: 8px 10px; resize: vertical; }
.small-link { background: none; border: 0; padding: 0; font-size: 12px; color: var(--teal-strong); cursor: pointer; }
.small-link:hover { text-decoration: underline; }

/* Meetings */
.mtg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 36px; }
@media (max-width: 860px) { .mtg-grid { grid-template-columns: minmax(0, 1fr); } }
.mtg-grid > .small-link { grid-column: 1 / -1; justify-self: start; }
.mtg-allday { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); }
.mtg-list { list-style: none; margin: 0; padding: 0; }
.mtg { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mtg-time { font-size: 13px; color: var(--muted); }
.mtg.now .mtg-time { color: var(--teal-strong); font-weight: 600; }
.mtg.now { box-shadow: inset 3px 0 0 var(--teal); padding-left: 8px; }
.mtg.past { opacity: 0.55; }
.mtg.cancelled .mtg-title { text-decoration: line-through; }
.mtg-body { display: flex; flex-direction: column; min-width: 0; }
.mtg-title { font-weight: 500; overflow-wrap: anywhere; }
.mtg-meta { font-size: 12px; color: var(--muted); }
.mtg-accts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }

  .rail-drawer:not(.open) .drawer-body { display: none; }

}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div id="app"></div>

<script>
(() => {
  "use strict";

  // ── Config ─────────────────────────────────────────────────────────────
  const ZAPIER = "Zapier";
  const READ_TOOL = "execute_zapier_read_action";
  const DENSE_WINDOWS = [{ days: 7, min: 3 }, { days: 14, min: 4 }, { days: 30, min: 6 }];
  const STALE_AFTER_DAYS = 60;
  const TIMELINE_VISIBLE = 15;

  // ── Tiny DOM helper (all Salesforce text goes in as text nodes) ────────
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "style") el.style.cssText = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : String(kid));
    }
    return el;
  }
  const mount = (el, ...kids) => { if (el) el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false)); };
  const extLink = (href, props, ...kids) => h("a", { href, target: "_blank", rel: "noopener noreferrer", ...props }, ...kids);

  // ── Dates (browser-local "today") ──────────────────────────────────────
  const pad = (n) => String(n).padStart(2, "0");
  const localDay = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseSfDateTime = (s) => new Date(String(s).replace(/([+-]\d{2})(\d{2})$/, "$1:$2"));
  function dayDiff(isoDay) {
    const [y, m, d] = isoDay.slice(0, 10).split("-").map(Number);
    const t = new Date();
    return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
  }
  function fmtDate(isoDay) {
    if (!isoDay) return "—";
    const [y, m, d] = isoDay.slice(0, 10).split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function relDays(isoDay) {
    const n = dayDiff(isoDay);
    if (n === 0) return "today";
    if (n === -1) return "yesterday";
    if (n === 1) return "tomorrow";
    return n < 0 ? `${-n}d ago` : `in ${n}d`;
  }

  // ── Salesforce via the viewer's Zapier connector ───────────────────────
  let mcp = null;
  let mcpState = "loading"; // loading | ready | absent

  const soqlStr = (v) => String(v).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  const soqlLike = (v) => soqlStr(v).replace(/%/g, "\\%").replace(/_/g, "\\_");
  const isSfId = (id) => /^[a-zA-Z0-9]{15}([a-zA-Z0-9]{3})?$/.test(id || "");

  function recordsFrom(payload) {
    let p = payload;
    if (typeof p === "string") { try { p = JSON.parse(p); } catch { return []; } }
    if (Array.isArray(p)) return p;
    if (p && Array.isArray(p.results)) return p.results;
    if (p && typeof p === "object") {
      const arr = Object.values(p).find(Array.isArray);
      if (arr) return arr;
    }
    return [];
  }

  async function soql(query, { fresh = false } = {}) {
    if (!mcp) throw { code: mcpState === "absent" ? "not_granted" : "loading", message: "Salesforce connection not ready" };
    const input = {
      selected_api: "SalesforceCLIAPI",
      action: "custom_soql_query",
      tool_name: "salesforce_custom_soql_query",
      params: { query_type: "custom", dynamic_properties: { soql_query: query } },
    };
    const opts = { cache: { staleTime: 20000, gcTime: 30 * 60000, refresh: fresh } };
    try {
      return recordsFrom((await mcp.callTool(ZAPIER, READ_TOOL, input, opts)).payload);
    } catch (err) {
      if (err && err.retryable) {
        await new Promise((r) => setTimeout(r, (err.retryAfterMs || 800) + Math.random() * 600));
        return recordsFrom((await mcp.callTool(ZAPIER, READ_TOOL, input, opts)).payload);
      }
      throw err;
    }
  }

  function errorView(err) {
    const code = err && err.code;
    const map = {
      needs_reauth: ["Zapier needs to be reconnected", "Reconnect Zapier in claude.ai → Settings → Connectors, then press Refresh."],
      server_not_connected: ["Zapier isn’t connected", "Add the Zapier connector in claude.ai → Settings → Connectors. Its Salesforce app provides this page’s data."],
      selection_required: ["Choose a Zapier connection", "You have more than one Zapier connector. Pick one in the prompt Claude shows, then press Refresh."],
      not_in_manifest: ["Zapier access is off for this page", "Allow Zapier for this page when Claude asks (reload the page to be asked again)."],
      blocked_by_policy: ["Blocked by your organization", "Your Claude organization’s policy blocks this Zapier tool."],
      approval_required: ["Needs approval", "Your organization requires approval for this Zapier tool."],
      not_granted: ["Open this in Claude", "This page reads Salesforce through your Claude connectors, so it only works inside claude.ai or the Claude desktop app."],
      capability_disabled: ["Open this in Claude", "This view can’t reach your connectors. Open the page in claude.ai or the Claude desktop app."],
      server_unavailable: ["Zapier didn’t respond", "Salesforce via Zapier timed out. Press Refresh to try again."],
    };
    if (code === "tool_error") {
      const msg = String(err.message || "").replace(/^Error during execution:\s*/i, "").trim();
      return h("div", { class: "notice" }, h("strong", {}, "Salesforce returned an error"), msg || "The query failed.");
    }
    const [title, body] = map[code] || ["Couldn’t load from Salesforce", (err && err.message) || "Unknown error. Press Refresh to try again."];
    return h("div", { class: "notice" }, h("strong", {}, title), body);
  }

  // ── Shared store: primary pins + Quick Access links ────────────────────
  let db = null;
  let dbState = "loading";
  let defaults = new Map(); // docId -> items
  let defaultsUnsub = null;

  function subscribeDefaults() {
    if (!db || defaultsUnsub) return;
    defaultsUnsub = db.collection("resource-defaults").onSnapshot(
      (snap) => {
        defaults = new Map(snap.docs.map((d) => [d.id, (d.data() || {}).items || []]));
        if (route.view === "sheet") renderResources();
      },
      () => { defaultsUnsub = null; },
    );
  }

  const typeKey = (type) => "type-" + String(type || "none").replace(/[^A-Za-z0-9_-]/g, "_").slice(0, 60);

  function safeUrl(raw) {
    const v = String(raw || "").trim();
    if (!v) return null;
    try {
      const u = new URL(/^https?:\/\//i.test(v) ? v : "https://" + v);
      return u.protocol === "https:" || u.protocol === "http:" ? u.toString() : null;
    } catch { return null; }
  }

  // ── Prose rendering for relationship fields ────────────────────────────
  const BULLET = /^\s*(?:[-*•–·]|\d+[.)])\s+/;
  function htmlToText(input) {
    if (!/<[a-z!/][\s\S]*>/i.test(input)) return input;
    const doc = new DOMParser().parseFromString(
      input.replace(/<\s*br\s*\/?>/gi, "\n").replace(/<\s*li[^>]*>/gi, "\n- ").replace(/<\/\s*(p|div|li|h[1-6]|ul|ol)\s*>/gi, "\n\n"),
      "text/html",
    );
    return doc.body.textContent || "";
  }
  function lineNode(text) {
    const m = text.match(/^([A-Z][^:.!?]{0,28}):\s+(.+)$/);
    return m ? [h("strong", {}, m[1] + ":"), " ", m[2]] : [text];
  }
  function prose(raw, emptyText) {
    if (!raw || !String(raw).trim()) return h("p", { class: "empty" }, emptyText);
    const text = htmlToText(String(raw)).replace(/\r\n?/g, "\n");
    const out = h("div", { class: "prose" });
    for (const chunk of text.split(/\n{2,}/)) {
      const lines = chunk.split("\n").map((l) => l.trim()).filter(Boolean);
      let para = null, list = null;
      for (const line of lines) {
        if (BULLET.test(line)) {
          para = null;
          if (!list) { list = h(/^\s*\d/.test(line) ? "ol" : "ul"); out.append(list); }
          list.append(h("li", {}, lineNode(line.replace(BULLET, ""))));
        } else {
          list = null;
          if (!para) { para = h("p"); out.append(para); } else para.append(h("br"));
          para.append(...lineNode(line));
        }
      }
    }
    return out;
  }

  function statusTone(s) {
    if (!s) return "";
    // Org values: Engaged, Active Opportunity, Customer (teal) · Engaged — Dormant (rust) · Not Engaged (neutral)
    if (/risk|churn|lost|inactive|stalled|dormant|closed|former|cancel/i.test(s)) return "rust";
    if (/^\s*not\b|unengaged/i.test(s)) return "";
    if (/active|customer|engaged|opportun|partner|pilot/i.test(s)) return "teal";
    return "";
  }

  // ── Theme toggle (overrides the viewer's theme when set) ───────────────
  const THEMES = ["auto", "light", "dark"];
  let theme = "auto";
  try { const t = localStorage.getItem("cheatsheet-theme"); if (THEMES.includes(t)) theme = t; } catch {}
  function applyTheme() {
    if (theme === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
  }
  function themeButton(onRail) {
    const label = { auto: "◐ Auto", light: "☀ Light", dark: "☾ Dark" }[theme];
    return h("button", {
      type: "button", class: "pill-btn" + (onRail ? " on-rail" : ""), title: "Switch color theme",
      onclick: () => {
        theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
        try { localStorage.setItem("cheatsheet-theme", theme); } catch {}
        applyTheme();
        render();
      },
    }, label);
  }

  // ── Routing ────────────────────────────────────────────────────────────
  let route = { view: "search" };
  let query = "";
  function readHash() {
    const m = location.hash.match(/^#a-([a-zA-Z0-9]{15,18})$/);
    route = m ? { view: "sheet", id: m[1] } : { view: "search" };
  }
  function go(id) {
    const target = id ? "#a-" + id : "";
    if (id && location.hash !== target) { location.hash = target; window.scrollTo(0, 0); return; } // hashchange renders
    if (!id) history.pushState(null, "", location.pathname + location.search);
    readHash();
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => { readHash(); render(); });
  window.addEventListener("popstate", () => { readHash(); render(); });

  // ── Search view ────────────────────────────────────────────────────────
  let searchSeq = 0;
  let searchTimer = null;
  const SUMMARY_FIELDS = "Id, Name, Type, Relationship_Status__c, Region__c, Country__c, Owner.Name, LastActivityDate";

  function renderSearch() {
    const input = h("input", {
      id: "account-search", type: "search", autocomplete: "off", spellcheck: "false",
      placeholder: "Search any account by company name…", value: query,
      oninput: (e) => {
        query = e.target.value;
        showHomeMode();
        clearTimeout(searchTimer);
        if (query.trim()) searchTimer = setTimeout(runSearch, 350);
      },
    });
    const app = document.getElementById("app");
    mount(app,
      h("header", { class: "topbar" },
        h("div", { class: "topbar-inner" },
          h("div", { class: "wordmark" }, "Otoma ", h("span", {}, "Account Cheat Sheet")),
          themeButton(true))),
      h("main", { class: "landing" },
        h("h1", {}, "Who are you calling?"),
        h("form", { class: "search", role: "search", onsubmit: (e) => { e.preventDefault(); clearTimeout(searchTimer); if (query.trim()) runSearch(); } },
          h("label", { for: "account-search", class: "sr-only" }, "Search accounts"),
          svgSearch(),
          input,
          h("span", { class: "pending", id: "search-pending", hidden: true }, "Searching…")),
        h("div", { id: "search-area", hidden: true },
          h("div", { class: "results-head" },
            h("span", { class: "eyebrow", id: "results-label" }, ""),
            h("button", { type: "button", class: "pill-btn", onclick: () => runSearch(true) }, "Refresh")),
          h("div", { id: "results" }, skeletonRows())),
        h("div", { id: "dashboard" },
          h("div", { class: "dash-head" },
            h("span", { class: "meta", id: "dash-loaded" }, "Loading from Salesforce…"),
            h("button", { type: "button", class: "pill-btn", onclick: () => loadDashboard(true) }, "Refresh")),
          h("section", { class: "panel" },
            h("div", { class: "panel-head" }, h("h2", {}, "Meetings"), h("span", { class: "meta num", id: "meetings-meta" })),
            h("div", { id: "dash-meetings", class: "mtg-grid" }, skeletonRows())),
          h("div", { class: "dash" },
            h("section", { class: "panel dash-opps" },
              h("div", { class: "panel-head" }, h("h2", {}, "Open opportunities"), h("span", { class: "meta num", id: "opps-meta" })),
              h("div", { id: "stage-strip", class: "stage-strip" }),
              h("div", { id: "dash-opps" }, skeletonRows())),
            h("div", { class: "dash-side" },
              h("section", { class: "panel" },
                h("div", { class: "panel-head" }, h("h2", {}, "Due in the next 2 weeks"), h("span", { class: "meta num", id: "due-meta" })),
                h("div", { id: "dash-tasks" }, skeletonRows())),
              h("section", { class: "panel" },
                h("div", { class: "panel-head" }, h("h2", {}, "Recently engaged"), h("span", { class: "meta" }, "1:1 touches · last 14 days")),
                h("div", { id: "dash-recent" }, skeletonRows())))))));
    showHomeMode();
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
    if (query.trim()) runSearch();
    loadDashboard(false);
  }

  function showHomeMode() {
    const searching = !!query.trim();
    const area = document.getElementById("search-area");
    const dash = document.getElementById("dashboard");
    if (area) area.hidden = !searching;
    if (dash) dash.hidden = searching;
  }

  const openAccount = (id) => (e) => { e.preventDefault(); go(id); };
  const accountLink = (id, name, cls) => isSfId(id)
    ? h("a", { href: "#a-" + id, class: cls || "acct-link", onclick: openAccount(id) }, name || "Unnamed account")
    : h("span", { class: cls || "" }, name || "—");

  // ── Campaign detection ─────────────────────────────────────────────────
  // The same email subject logged against many accounts is a campaign send,
  // not a 1:1 touch. Computed from 30 days of email tasks, cached in the
  // page's store for 6 hours so it's rarely recomputed.
  const CAMPAIGN_MIN_ACCOUNTS = 5;
  const CAMPAIGN_TTL_MS = 6 * 3600 * 1000;
  let campaigns = null; // { list: [{s, accounts, sends}], set: Set, computedAt }
  let campaignsPromise = null;
  const isReplyOrInbound = (subj) => /^(email:\s*)?(\[external\][-\s]*)?(re|fw|fwd|aw)\s*:/i.test(subj) || /^\[external\]/i.test(subj);

  function adoptCampaigns(doc) {
    const list = Array.isArray(doc.list) ? doc.list.filter((c) => c && typeof c.s === "string") : [];
    campaigns = { list, set: new Set(list.map((c) => c.s)), computedAt: doc.computedAt || 0 };
    return campaigns;
  }

  function ensureCampaigns(force) {
    if (!force && campaigns && Date.now() - campaigns.computedAt < CAMPAIGN_TTL_MS) return Promise.resolve(campaigns);
    if (campaignsPromise) return campaignsPromise;
    campaignsPromise = (async () => {
      if (!force && db) {
        try {
          const snap = await db.doc("cache/campaigns").get();
          const d = snap.exists ? snap.data() : null;
          if (d && Date.now() - (d.computedAt || 0) < CAMPAIGN_TTL_MS) return adoptCampaigns(d);
        } catch {}
      }
      const rows = await soql(
        "SELECT Subject, AccountId FROM Task WHERE TaskSubtype = 'Email' AND ActivityDate = LAST_N_DAYS:30 " +
        "AND AccountId != null ORDER BY ActivityDate DESC LIMIT 2000", { fresh: !!force });
      const by = new Map();
      for (const r of rows) {
        const subj = r.Subject;
        if (!subj || isReplyOrInbound(subj)) continue;
        const g = by.get(subj) || { s: subj, accts: new Set(), sends: 0 };
        g.accts.add(r.AccountId); g.sends++;
        by.set(subj, g);
      }
      const list = [...by.values()].filter((g) => g.accts.size >= CAMPAIGN_MIN_ACCOUNTS)
        .sort((a, b) => b.sends - a.sends).slice(0, 80)
        .map((g) => ({ s: g.s, accounts: g.accts.size, sends: g.sends }));
      const doc = { list, computedAt: Date.now(), sampled: rows.length };
      if (db) db.doc("cache/campaigns").set(doc).catch(() => {});
      return adoptCampaigns(doc);
    })().finally(() => { campaignsPromise = null; });
    return campaignsPromise;
  }
  const isCampaign = (subj) => !!(campaigns && subj && campaigns.set.has(subj));
  const cleanCampaign = (subj) => String(subj).replace(/^email:\s*/i, "");

  // ── Home dashboard ─────────────────────────────────────────────────────
  let dashSeq = 0;
  async function loadDashboard(fresh) {
    if (route.view !== "search") return;
    if (!mcp) {
      if (mcpState === "absent") ["dash-meetings", "dash-opps", "dash-tasks", "dash-recent"].forEach((id) => mount(document.getElementById(id), errorView({ code: "not_granted" })));
      return;
    }
    const seq = ++dashSeq;
    const current = () => seq === dashSeq && route.view === "search";
    const loaded = document.getElementById("dash-loaded");
    if (loaded && fresh) loaded.textContent = "Refreshing from Salesforce…";
    const jobs = [
      ["dash-opps", soql(
        "SELECT Id, Name, StageName, Amount, CloseDate, NextStep, LastActivityDate, AccountId, Account.Name, Owner.Name " +
        "FROM Opportunity WHERE IsClosed = false ORDER BY CloseDate ASC NULLS LAST LIMIT 200", { fresh }), renderDashOpps],
      ["dash-tasks", soql(
        "SELECT Id, Subject, ActivityDate, Status, Priority, TaskSubtype, AccountId, Account.Name, What.Name, Who.Name, Owner.Name " +
        "FROM Task WHERE IsClosed = false AND ActivityDate <= NEXT_N_DAYS:14 ORDER BY ActivityDate ASC LIMIT 200", { fresh }), renderDashTasks],
      ["dash-meetings", loadMeetings(fresh), renderMeetings],
      ["dash-recent", ensureCampaigns(false).catch(() => null).then((c) => {
        const excl = c && c.list.length ? ` AND Subject NOT IN (${c.list.map((x) => `'${soqlStr(x.s)}'`).join(", ")})` : "";
        return soql(
          "SELECT Id, Subject, ActivityDate, TaskSubtype, AccountId, Account.Name, Who.Name " +
          `FROM Task WHERE IsClosed = true AND ActivityDate = LAST_N_DAYS:14 AND AccountId != null${excl} ORDER BY ActivityDate DESC LIMIT 1000`, { fresh });
      }), renderDashRecent],
    ];
    await Promise.all(jobs.map(async ([id, p, fn]) => {
      try {
        const rows = await p;
        if (current()) fn(rows);
      } catch (err) {
        if (current()) mount(document.getElementById(id), errorView(err));
      }
    }));
    if (!current()) return;
    const el = document.getElementById("dash-loaded");
    if (el) mount(el, h("span", { class: "live-dot", "aria-hidden": "true" }), "Live from Salesforce · loaded ",
      new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }));
  }

  // Meetings: Salesforce Events (your synced work calendar) for today and tomorrow,
  // linked to accounts directly or through their attendees.
  async function loadMeetings(fresh) {
    const events = await soql(
      "SELECT Id, Subject, StartDateTime, EndDateTime, IsAllDayEvent, Location, AccountId, Account.Name " +
      "FROM Event WHERE StartDateTime >= TODAY AND StartDateTime <= NEXT_N_DAYS:1 ORDER BY StartDateTime ASC LIMIT 100", { fresh });
    const ids = events.map((e) => e.Id).filter(isSfId);
    let rels = [], contacts = [];
    if (ids.length) {
      rels = await soql(
        `SELECT EventId, RelationId, Relation.Name, Relation.Type FROM EventRelation WHERE EventId IN (${ids.map((i) => `'${i}'`).join(",")})`, { fresh });

  async function loadSheet(id, freshData) {
    if (!isSfId(id)) { sheet.errors.account = { message: "That link doesn’t contain a valid Salesforce Account ID." }; renderAccountParts(); return; }

      if (mcpState === "absent") { sheet.errors.account = { code: "not_granted" }; renderAccountParts(); }
      return; // re-run once the connector resolves

    const seq = ++sheetSeq;
    const sid = soqlStr(id);
    const current = () => seq === sheetSeq && route.view === "sheet" && route.id === id;
    const loaded = document.getElementById("loaded-at");
    if (loaded && freshData) loaded.textContent = "Refreshing from Salesforce…";

    const jobs = {
      account: soql(
        `SELECT Id, Name, Type, Relationship_Status__c, TAM_Segment__c, Region__c, Country__c, ` +
        `Current_Payments_Platform_Vendor__c, Account_Relationship_Summary__c, Account_Strategic_Notes__c, ` +
        `Website, Industry, Owner.Name, LastActivityDate FROM Account WHERE Id = '${sid}' LIMIT 1`, { fresh: freshData }),
      contacts: soql(
        `SELECT Id, Name, Title, Email, Phone FROM Contact WHERE AccountId = '${sid}' ORDER BY LastName ASC NULLS LAST LIMIT 200`, { fresh: freshData }),
      tasks: soql(
        `SELECT Id, Subject, ActivityDate, CreatedDate, Status, IsClosed, TaskSubtype, Who.Name, Owner.Name ` +
        `FROM Task WHERE AccountId = '${sid}' ORDER BY ActivityDate DESC NULLS LAST, CreatedDate DESC LIMIT 500`, { fresh: freshData }),
      taskRel: soql(
        `SELECT RelationId, TaskId, Task.ActivityDate, Task.Subject, Task.IsClosed FROM TaskRelation ` +
        `WHERE Task.AccountId = '${sid}' AND IsWhat = false ORDER BY Task.ActivityDate DESC LIMIT 2000`, { fresh: freshData }),
      eventRel: soql(
        `SELECT EventId, RelationId, Relation.Type, Event.Subject, Event.StartDateTime, Event.IsAllDayEvent, Event.Location ` +
        `FROM EventRelation WHERE Event.AccountId = '${sid}' ORDER BY Event.StartDateTime DESC LIMIT 1000`, { fresh: freshData }),
      campaigns: ensureCampaigns(false).then(() => []),
      opps: soql(
        `SELECT Id, Name, StageName, Amount, CloseDate, NextStep FROM Opportunity ` +
        `WHERE AccountId = '${sid}' AND IsClosed = false ORDER BY CloseDate ASC NULLS LAST LIMIT 50`, { fresh: freshData }),
    };
    await Promise.all(Object.entries(jobs).map(async ([key, p]) => {
      try {
        const rows = await p;
        if (!current()) return;
        if (key !== "campaigns") sheet[key] = key === "account" ? (rows[0] || false) : rows;
        delete sheet.errors[key];
      } catch (err) {

    renderResources();
  }

  function newsName(accountName) {
    const SUFFIX = /\b(inc|incorporated|llc|ltd|limited|plc|corp|corporation|co|company|gmbh|ag|sa|nv|bv|holdings?|group)\.?$/i;
    let n = String(accountName).replace(/\(.*?\)/g, "").replace(/,/g, " ").trim();
    for (let i = 0; i < 3; i++) { const next = n.replace(SUFFIX, "").trim(); if (!next) break; n = next; }
    return n.replace(/\s+/g, " ");
  }

  // Open opportunities on this account
  function renderSheetOpps() {
    const el = document.getElementById("sheet-opps");
    const meta = document.getElementById("sheet-opps-meta");
    if (!el || !sheet) return;
    if (sheet.errors.opps) { mount(el, errorView(sheet.errors.opps)); return; }

    if (meta) meta.textContent = sheet.opps.length ? `${sheet.opps.length} open` : "";
    if (!sheet.opps.length) { mount(el, h("p", { class: "empty" }, "No open opportunities on this account.")); return; }
    mount(el, h("ul", { class: "sheet-opps" }, sheet.opps.map((o) => {
      const late = o.CloseDate && dayDiff(o.CloseDate) < 0;
      return h("li", { class: "sheet-opp" },
        h("div", {},
          h("div", { style: "font-weight:600" }, o.Name),
          o.NextStep && h("div", { class: "opp-next" }, h("span", { class: "opp-next-label" }, "Next step "), o.NextStep)),

    })));
  }

  // Suggested outreach, drafted by Claude on the viewer's account
  let sample = null;
  let sampleState = "loading";
  let outreach = { status: "idle", text: "", error: null, ctl: null };
  const DEFAULT_CONTEXT = "Otoma sells next-generation payments technology to banks. Keep outreach short, specific and peer-to-peer; reference real context from the notes.";
  let outreachContext = DEFAULT_CONTEXT;
  let editingContext = false;

  const clip = (v, n) => { const t = String(v == null ? "" : v).replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n) + "…" : t; };

  function outreachPrompt() {
    const a = sheet.account || {};
    const contacts = (sheet.contacts || []).slice().sort((x, y) => Number(pins.has(y.Id)) - Number(pins.has(x.Id))).slice(0, 25)
      .map((c) => `- ${c.Name}${c.Title ? `, ${clip(c.Title, 90)}` : ""}${pins.has(c.Id) ? " [PRIMARY]" : ""}${c.Email ? "" : " (no email)"}${covNote(c)}`);
    const tasks = (sheet.tasks || []).filter((t) => !isCampaign(t.Subject)).slice(0, 15)
      .map((t) => `- ${effDate(t)} · ${t.IsClosed ? "done" : "open"} · ${clip(t.Subject, 110)}${t.Who && t.Who.Name ? ` · with ${t.Who.Name}` : ""}`);
    const cov = sheet.taskRel && sheet.eventRel ? coverageByContact() : null;
    const covNote = (c) => {
      if (!cov) return "";
      const v = cov.get(c.Id);
      if (!v) return " · never contacted";
      const bits = [];
      if (v.nextMeeting) bits.push(`meeting ${v.nextMeeting}`);
      if (v.meetings) bits.push(`met ${v.meetings}x`);
      if (v.personal) bits.push(`${v.personal} 1:1 touches, last ${v.lastPersonal}`);
      if (!v.personal && !v.meetings && !v.nextMeeting && v.campaign) bits.push("campaign emails only");
      return bits.length ? " · " + bits.join(", ") : "";
    };
    const opps = (sheet.opps || []).map((o) => `- ${clip(o.Name, 90)} · ${o.StageName || "no stage"} · close ${o.CloseDate || "n/a"}${o.NextStep ? ` · next step: ${clip(o.NextStep, 240)}` : ""}`);
    return [
      "You help a salesperson at Otoma plan their next outreach to one account.",
      `About Otoma and house style: ${clip(outreachContext, 800)}`,
      `Today is ${localDay(new Date())}.`,
      "Use ONLY the CRM data below. Don't invent facts, names, numbers or events. If the data is thin, say what to find out.",
      "",
      "Reply in exactly this format, plain text, no bold or other markdown except the ## headings:",
      "## Angle",
      "2-3 short bullets starting with \"- \": why reach out now and what to lead with.",
      "## Who",
      "1-3 bullets starting with \"- \": which contact(s) from the list, and why. Prefer [PRIMARY] contacts.",
      "## Email",
      "Subject: <subject line>",
      "<email to the first contact you named, under 120 words, plain and specific, signed [Your name]>",
      "## Watch out",
      "1-2 bullets starting with \"- \": risks or sensitivities from the notes. Write \"- None noted\" if there are none.",
      "",
      "=== CRM DATA ===",
      `Account: ${a.Name || "?"} · Type: ${a.Type || "?"} · Relationship: ${a.Relationship_Status__c || "?"} · Segment: ${a.TAM_Segment__c || "?"} · Region: ${[a.Region__c, a.Country__c].filter(Boolean).join(", ") || "?"} · Current payments vendor: ${a.Current_Payments_Platform_Vendor__c || "?"}`,
      `Relationship summary: ${clip(htmlToText(a.Account_Relationship_Summary__c || ""), 2500) || "(none)"}`,
      `Strategic notes: ${clip(htmlToText(a.Account_Strategic_Notes__c || ""), 2500) || "(none)"}`,
      "Open opportunities:", ...(opps.length ? opps : ["- none"]),
      "Recent 1:1 activity, campaign sends excluded (newest first):", ...(tasks.length ? tasks : ["- none logged"]),
      "Contacts:", ...(contacts.length ? contacts : ["- none on record"]),
    ].join("\n");
  }

  async function draftOutreach(regenerate) {
    if (!sample || !sheet || !sheet.account) return;
    if (outreach.ctl) outreach.ctl.abort();
    const ctl = new AbortController();
    const forId = sheet.id;
    outreach = { status: "thinking", text: "", error: null, ctl };
    renderOutreach();
    try {
      const res = await sample(outreachPrompt(), {
        signal: ctl.signal,
        cache: regenerate ? false : { gcTime: 30 * 60000 },
        onText: ({ text }) => {
          if (!sheet || sheet.id !== forId) return;
          outreach.status = "streaming"; outreach.text = text; renderOutreachStream();
        },
      });
      if (!sheet || sheet.id !== forId) return;
      outreach = { status: "done", text: res.text, error: res.truncated ? "The draft was cut short. Try Regenerate." : null, ctl: null };
    } catch (e) {
      if (!sheet || sheet.id !== forId) return;
      const code = e && e.code;
      if (code === "cancelled") { outreach = { status: e.text ? "done" : "idle", text: e.text || "", error: null, ctl: null }; }
      else {
        const copy = {
          not_granted: "Claude isn’t allowed to draft on this page. Reload and choose Allow when asked.",
          sampling_disabled: "Claude drafting isn’t available on your account.",
          rate_limited: "You’ve hit a usage limit. Try again in a little while.",
          session_expired: "Your Claude session expired. Sign in again, then retry.",
          refused: "Claude declined to draft this one.",
          prompt_too_large: "There’s too much account data to send. Try again after trimming notes.",
        }[code] || "The draft didn’t finish. Try again.";
        if (code === "not_granted" || code === "sampling_disabled" || code === "capability_disabled" || code === "not_declared") sampleState = "absent";
        outreach = { status: e && e.text && code !== "refused" ? "done" : "idle", text: code === "refused" ? "" : (e && e.text) || "", error: copy, ctl: null };
      }
    }
    renderOutreach();
  }

  function parseSections(text) {
    const parts = String(text).split(/^##\s+/m).map((p) => p.trim()).filter(Boolean);
    return parts.map((p) => { const nl = p.indexOf("\n"); return nl === -1 ? { title: p, body: "" } : { title: p.slice(0, nl).trim(), body: p.slice(nl + 1).trim() }; });
  }

  function copyButton(getText) {
    const btn = h("button", { type: "button", class: "copy-btn" }, "Copy");
    btn.addEventListener("click", () => {
      const txt = getText();
      const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, () => selectDraft(btn));
      } else selectDraft(btn);
    });
    return btn;
  }
  function selectDraft(btn) {
    const pre = btn.closest("div") && btn.closest("div").querySelector(".email-draft");
    if (!pre) return;
    const r = document.createRange(); r.selectNodeContents(pre);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = "Selected, press ⌘C";
  }

  function renderOutreachStream() {
    const box = document.getElementById("outreach-body");
    if (box) mount(box, h("div", { class: "outreach-stream" }, outreach.text));
  }

  function renderOutreach() {
    const el = document.getElementById("outreach");
    if (!el || !sheet) return;
    if (sampleState === "absent" && outreach.status === "idle") {
      mount(el, h("p", { class: "empty" }, "Outreach drafting needs Claude, which isn’t available in this view. Open the page in claude.ai or the Claude app."));
      return;
    }
    const ready = !!sheet.account && sheet.contacts !== null && sheet.tasks !== null && sheet.opps !== null
      && (sheet.taskRel !== null || !!sheet.errors.taskRel) && (sheet.eventRel !== null || !!sheet.errors.eventRel);
    const busy = outreach.status === "thinking" || outreach.status === "streaming";
    const actions = h("div", { class: "outreach-actions" },
      !busy && h("button", { type: "button", class: "btn", disabled: !ready || !sample, onclick: () => draftOutreach(outreach.status === "done") },
        outreach.status === "done" ? "Regenerate" : "Draft outreach"),
      busy && h("button", { type: "button", class: "btn ghost", onclick: () => outreach.ctl && outreach.ctl.abort() }, "Stop"),
      !busy && outreach.status === "idle" && h("span", { class: "hint", style: "margin:0" },
        !ready ? "Waiting for Salesforce data…" : !sample ? "Connecting to Claude…" : "Uses this account’s notes, activity, opportunities and ★ primary contacts."),
      !busy && h("button", { type: "button", class: "small-link", style: "margin-left:auto", onclick: () => { editingContext = !editingContext; renderOutreach(); } },
        editingContext ? "Close context" : "Edit Otoma context"));

    let body;
    if (outreach.status === "thinking") body = h("div", { class: "outreach-thinking" }, "Thinking… (the first draft takes 10–40 seconds)");
    else if (outreach.status === "streaming") body = h("div", { class: "outreach-stream" }, outreach.text);
    else if (outreach.status === "done" && outreach.text) {
      body = h("div", { class: "outreach-sections" }, parseSections(outreach.text).map((sec) => {
        if (/^email/i.test(sec.title)) {
          return h("div", {}, h("h3", {}, sec.title, copyButton(() => sec.body)), h("div", { class: "email-draft" }, sec.body));
        }
        return h("div", {}, h("h3", {}, sec.title), prose(sec.body, "—"));
      }));
    }

    const ctxEditor = editingContext && h("div", { class: "context-edit" },
      h("label", { for: "outreach-context", class: "hint", style: "margin:0" }, "What Claude should know about Otoma and your style. Saved for every account."),
      h("textarea", { id: "outreach-context" }, outreachContext),
      h("div", { class: "outreach-actions" },
        h("button", { type: "button", class: "btn", disabled: !db, onclick: saveContext }, "Save context"),
        !db && h("span", { class: "hint", style: "margin:0" }, "Saving needs this page’s storage, which isn’t available in this view.")));

    mount(el, h("div", { class: "outreach-box" },
      actions,
      ctxEditor,
      h("div", { id: "outreach-body" }, body),
      outreach.error && h("p", { class: "error-inline" }, outreach.error)));
  }

  async function saveContext() {
    const ta = document.getElementById("outreach-context");
    const text = (ta ? ta.value : "").trim().slice(0, 1500) || DEFAULT_CONTEXT;
    try {
      await db.doc("settings/outreach").set({ context: text, updatedAt: new Date().toISOString() });
      outreachContext = text; editingContext = false;
    } catch (err) {
      outreach.error = err && err.code === "invalid_argument" ? "You have view-only access, so the context can’t be saved." : "Couldn’t save the context. Try again.";
    }
    renderOutreach();
  }

  // Contacts + primary pins
  let pinError = null;
  let pinWrite = Promise.resolve();

  // Contact coverage: who we've reached 1:1 or met, who only got campaigns, who's untouched
  let coverageFilter = "all"; // all | reached | campaign | never
  function seniority(title) {
    const t = String(title || "");
    if (/\b(chief|ceo|cfo|coo|cto|cio|cro|cdo|president|founder|chair|partner)\b/i.test(t)) return 0;
    if (/\b(evp|svp|managing director|md|general manager|global head|group head)\b/i.test(t)) return 1;
    if (/\b(head of|head,|vp|vice president)\b|^head\b/i.test(t)) return 2;
    if (/\bdirector\b/i.test(t)) return 3;
    return 4;
  }

  function coverageByContact() {
    const cov = new Map();
    const get = (id) => { let c = cov.get(id); if (!c) { c = { personal: 0, lastPersonal: null, campaign: 0, meetings: 0, lastMeeting: null, nextMeeting: null }; cov.set(id, c); } return c; };
    const today = localDay(new Date());
    for (const r of sheet.taskRel || []) {
      if (!r.Task || !isSfId(r.RelationId)) continue;
      const d = r.Task.ActivityDate;
      if (d && d > today) continue; // future tasks aren't touches yet
      const c = get(r.RelationId);
      if (isCampaign(r.Task.Subject)) c.campaign++;
      else { c.personal++; if (d && (!c.lastPersonal || d > c.lastPersonal)) c.lastPersonal = d; }
    }
    for (const r of sheet.eventRel || []) {
      if (!r.Event || !r.Relation || r.Relation.Type !== "Contact") continue;
      if (/cancel+ed/i.test(r.Event.Subject || "")) continue;
      const c = get(r.RelationId);
      const d = r.Event.IsAllDayEvent ? r.Event.StartDateTime.slice(0, 10) : localDay(parseSfDateTime(r.Event.StartDateTime));
      const upcoming = r.Event.IsAllDayEvent ? d > today : parseSfDateTime(r.Event.StartDateTime).getTime() > Date.now();
      if (upcoming) { if (!c.nextMeeting || d < c.nextMeeting) c.nextMeeting = d; }
      else { c.meetings++; if (!c.lastMeeting || d > c.lastMeeting) c.lastMeeting = d; }
    }
    return cov;
  }

  function renderContacts() {
    const el = document.getElementById("contacts");
    const meta = document.getElementById("contacts-meta");
    if (!el || !sheet) return;
    if (sheet.errors.contacts) { mount(el, errorView(sheet.errors.contacts)); return; }
    if (!sheet.contacts) { mount(el, h("div", { class: "contacts" }, [0, 1, 2].map(() => h("div", { class: "skeleton", style: "height:110px" })))); return; }
    const list = sheet.contacts;
    const primaryCount = list.filter((c) => pins.has(c.Id)).length;
    if (meta) meta.textContent = `${list.length} total${primaryCount ? ` · ${primaryCount} primary` : ""}`;
    if (!list.length) { mount(el, h("p", { class: "empty" }, "No contacts on this account in Salesforce yet.")); return; }

    const covReady = sheet.taskRel !== null && sheet.eventRel !== null;
    const covFailed = sheet.errors.taskRel || sheet.errors.eventRel;
    const cov = covReady ? coverageByContact() : new Map();
    const status = (c) => {
      const v = cov.get(c.Id);
      if (!v) return "never";
      if (v.personal || v.meetings || v.nextMeeting) return "reached";
      return v.campaign ? "campaign" : "never";
    };
    const lastTouch = (c) => { const v = cov.get(c.Id); return v ? [v.lastPersonal, v.lastMeeting].filter(Boolean).sort().pop() || "" : ""; };
    const counts = { reached: 0, campaign: 0, never: 0 };
    if (covReady) for (const c of list) counts[status(c)]++;

    const shown = list
      .filter((c) => !covReady || coverageFilter === "all" || status(c) === coverageFilter)
      .sort((x, y) => Number(pins.has(y.Id)) - Number(pins.has(x.Id))
        || seniority(x.Title) - seniority(y.Title)
        || lastTouch(y).localeCompare(lastTouch(x)));

    const chip = (key, label, n) => h("button", { type: "button", class: "cov-chip" + (coverageFilter === key ? " on" : "") + (key === "never" && n ? " warn" : ""),
      "aria-pressed": String(coverageFilter === key), onclick: () => { coverageFilter = key; renderContacts(); } }, h("strong", { class: "num" }, n), " ", label);

    const summary = covReady ? h("div", { class: "cov-summary" },
      chip("all", "all", list.length),
      chip("reached", "reached 1:1 or met", counts.reached),
      chip("campaign", "campaign emails only", counts.campaign),
      chip("never", "never contacted", counts.never))
      : h("p", { class: "hint", style: "margin:0 0 10px" }, covFailed ? "Couldn’t load contact history, so coverage isn’t shown." : "Loading contact history…");

    const canPin = !!db;
    mount(el,
      summary,
      shown.length ? h("div", { class: "contacts" }, shown.map((c) => {
        const primary = pins.has(c.Id);
        const v = cov.get(c.Id);
        const st = covReady ? status(c) : null;
        const lines = [];
        if (v && v.nextMeeting) lines.push(h("span", { class: "cov-next" }, `Meeting ${fmtDate(v.nextMeeting)} (${relDays(v.nextMeeting)})`));
        if (v && v.meetings) lines.push(`Met ${v.meetings}× · last ${relDays(v.lastMeeting)}`);
        if (v && v.personal) lines.push(`${v.personal} 1:1 ${v.personal === 1 ? "touch" : "touches"} · last ${v.lastPersonal ? relDays(v.lastPersonal) : "—"}`);
        if (v && v.campaign) lines.push(`${v.campaign} campaign ${v.campaign === 1 ? "email" : "emails"}`);
        return h("article", { class: "contact" + (primary ? " primary" : "") },
          (primary || st === "never" || st === "campaign") && h("div", { class: "card-flags" },
            primary && h("span", { class: "primary-label" }, "Primary"),
            st === "never" && h("span", { class: "cov-flag" }, "Never contacted"),
            st === "campaign" && h("span", { class: "cov-flag soft" }, "Campaign only")),
          h("div", { class: "cname" }, c.Name),
          h("div", { class: "ctitle" }, c.Title || "No title on record"),
          h("div", { class: "links" },
            c.Email ? h("a", { href: "mailto:" + c.Email, title: "Email " + c.Email }, c.Email) : h("span", { class: "missing" }, "No email"),
            c.Phone && h("span", { style: "user-select:all" }, c.Phone)),
          lines.length > 0 && h("div", { class: "cov-lines" }, lines.map((l) => h("div", {}, l))),
          h("button", {
            type: "button", class: "pin", "aria-pressed": String(primary), disabled: !canPin,
            title: canPin ? (primary ? "Unmark as primary" : "Mark as primary") : "Pinning needs this page’s shared storage, which isn’t available in this view",
            "aria-label": `${primary ? "Unmark" : "Mark"} ${c.Name} as primary contact`,
            onclick: () => togglePin(c.Id),
          }, primary ? "★" : "☆"));
      })) : h("p", { class: "empty" }, "No contacts in this group."),
      pinError && h("p", { class: "error-inline" }, pinError),
      h("p", { class: "hint" }, "Sorted by ★ primary, then seniority, then most recent touch. Campaign means the same email subject went to " + CAMPAIGN_MIN_ACCOUNTS + "+ accounts. ★ pins are saved with this page and don’t change Salesforce."));
  }

  function togglePin(contactId) {
    if (!db || !sheet) return;
    const id = sheet.id;
    const next = new Set(pins);
    next.has(contactId) ? next.delete(contactId) : next.add(contactId);
    pins = next;
    pinError = null;
    renderContacts();
    pinWrite = pinWrite.then(() => db.doc("pins/" + id).set({ ids: [...next], updatedAt: new Date().toISOString() }))
      .catch((err) => {
        pinError = err && err.code === "invalid_argument"
          ? "You have view-only access to this page, so pins can’t be saved."
          : "Couldn’t save the pin. Try again.";
        renderContacts();
      });
  }

  // Engagement timeline
  function effDate(t) { return t.ActivityDate || localDay(parseSfDateTime(t.CreatedDate)); }
  function isOverdue(t) { return !t.IsClosed && dayDiff(effDate(t)) < 0; }

  let showCampaignTasks = false;

  function renderTimeline() {
    const el = document.getElementById("timeline");
    const meta = document.getElementById("tasks-meta");
    if (!el || !sheet) return;
    if (sheet.errors.tasks) { mount(el, errorView(sheet.errors.tasks)); return; }
    if (!sheet.tasks) { mount(el, [0, 1, 2, 3].map(() => h("div", { class: "skeleton", style: "height:44px;margin-bottom:12px" }))); return; }
    // Meetings from the synced calendar join the timeline alongside tasks.
    const meetingsById = new Map();
    for (const r of sheet.eventRel || []) {
      if (!r.Event || meetingsById.has(r.EventId)) continue;
      const start = r.Event.StartDateTime;
      meetingsById.set(r.EventId, {
        kind: "meeting", Id: r.EventId, Subject: cleanEventTitle(r.Event.Subject),
        ActivityDate: r.Event.IsAllDayEvent ? start.slice(0, 10) : localDay(parseSfDateTime(start)),
        CreatedDate: start, IsClosed: true, cancelled: /cancel+ed/i.test(r.Event.Subject || ""),
        time: r.Event.IsAllDayEvent ? "All day" : timeOf(start), where: whereLabel(r.Event.Location),
        people: [],
      });
    }
    for (const r of sheet.eventRel || []) {
      const m = meetingsById.get(r.EventId);
      if (m && r.Relation && r.Relation.Type === "Contact") {
        const c = (sheet.contacts || []).find((x) => x.Id === r.RelationId);
        if (c) m.people.push(c.Name);
      }
    }
    const meetings = [...meetingsById.values()].filter((m) => !m.cancelled);
    const allTasks = sheet.tasks.map((t) => ({ ...t, kind: isCampaign(t.Subject) ? "campaign" : "task" }));
    const campaignCount = allTasks.filter((t) => t.kind === "campaign").length;
    const items = [...allTasks.filter((t) => showCampaignTasks || t.kind !== "campaign"), ...meetings];
    const personal = [...allTasks.filter((t) => t.kind === "task"), ...meetings];
    if (meta) meta.textContent = `${allTasks.length - campaignCount} tasks · ${meetings.length} meetings${campaignCount ? ` · ${campaignCount} campaign` : ""}`;

    const sorted = items.sort((a, b) => effDate(b).localeCompare(effDate(a)) || String(b.CreatedDate).localeCompare(String(a.CreatedDate)));
    const past = sorted.filter((t) => dayDiff(effDate(t)) <= 0);
    const upcoming = sorted.filter((t) => dayDiff(effDate(t)) > 0).reverse();

    // Callouts count 1:1 touches and meetings only, never campaign sends.
    const pastPersonal = personal.filter((t) => dayDiff(effDate(t)) <= 0
      && !(t.kind === "meeting" && t.time !== "All day" && parseSfDateTime(t.CreatedDate).getTime() > Date.now()));
    let density = null;
    for (const w of DENSE_WINDOWS) {
      const count = pastPersonal.filter((t) => -dayDiff(effDate(t)) < w.days).length;
      if (count >= w.min) { density = { count, days: w.days }; break; }
    }
    const lastPersonal = pastPersonal.map(effDate).sort().pop();
    const daysSince = lastPersonal ? -dayDiff(lastPersonal) : null;
    const stale = daysSince === null || daysSince > STALE_AFTER_DAYS;
    const overdue = allTasks.filter(isOverdue).length;
    const nextMeeting = meetings.filter((m) => dayDiff(m.ActivityDate) >= 0 && parseSfDateTime(m.CreatedDate).getTime() > Date.now() - 3600e3)
      .sort((a, b) => String(a.CreatedDate).localeCompare(String(b.CreatedDate)))[0];

    const callouts = h("div", { class: "callouts" },
      nextMeeting && h("span", { class: "callout" }, "Next meeting ", h("strong", {}, dayDiff(nextMeeting.ActivityDate) === 0 ? "today" : relDays(nextMeeting.ActivityDate)), ` · ${clip(nextMeeting.Subject, 60)}`),
      density && h("span", { class: "callout" }, h("strong", { class: "num" }, density.count), ` 1:1 touches in the last ${density.days} days`),
      stale && h("span", { class: "callout rust" }, daysSince === null ? "No 1:1 touches logged yet" : `No 1:1 touch in ${daysSince} days`),
      overdue > 0 && h("span", { class: "callout rust" }, h("strong", { class: "num" }, overdue), overdue === 1 ? " overdue task" : " overdue tasks"));

    const toggle = campaignCount > 0 && h("button", { type: "button", class: "small-link", style: "margin:0 0 12px", onclick: () => { showCampaignTasks = !showCampaignTasks; renderTimeline(); } },
      showCampaignTasks ? "Hide campaign emails" : `Show ${campaignCount} campaign ${campaignCount === 1 ? "email" : "emails"}`);

    if (!items.length) {
      mount(el, callouts, toggle, h("p", { class: "empty" }, campaignCount ? "Only campaign emails are logged for this account." : "No tasks or meetings logged for this account in Salesforce."));
      return;
    }

    const item = (t, isUpcoming) => {
      const d = effDate(t);
      if (t.kind === "meeting") {
        return h("li", { class: "tl-item meeting" + (isUpcoming ? " upcoming" : "") },
          h("div", { class: "tl-date num" }, h("span", {}, fmtDate(d)), h("span", {}, relDays(d)), h("span", {}, t.time)),
          h("div", { class: "tl-subject" }, t.Subject),
          h("div", { class: "tl-meta" }, h("span", { class: "s-open" }, "Meeting"),
            t.people.length > 0 && h("span", {}, "with " + t.people.slice(0, 4).join(", ") + (t.people.length > 4 ? ` +${t.people.length - 4}` : "")),
            t.where && h("span", {}, t.where)));
      }
      const od = isOverdue(t);
      const state = t.kind === "campaign" ? "campaign" : od ? "overdue" : isUpcoming ? "upcoming" : t.IsClosed ? "done" : "open";
      return h("li", { class: "tl-item " + state },
        h("div", { class: "tl-date num" },
          h("span", {}, fmtDate(d)), h("span", {}, relDays(d)),
          !t.ActivityDate && h("span", { title: "No due date; showing created date" }, "(created)")),
        h("div", { class: "tl-subject" }, t.Subject || "(no subject)"),
        h("div", { class: "tl-meta" },
          t.kind === "campaign" && h("span", { class: "tag-campaign" }, "Campaign"),
          h("span", { class: od ? "s-overdue" : !t.IsClosed ? "s-open" : "" }, od ? `Overdue · ${t.Status || "Open"}` : (t.Status || "—")),
          t.TaskSubtype && t.TaskSubtype !== "Task" && h("span", {}, t.TaskSubtype),
          t.Who && t.Who.Name && h("span", {}, "with " + t.Who.Name),
          t.Owner && t.Owner.Name && h("span", {}, "by " + t.Owner.Name)));
    };

    const visible = showAllTimeline ? past : past.slice(0, TIMELINE_VISIBLE);
    mount(el, callouts, toggle,
      h("ol", { class: "timeline" },
        upcoming.length > 0 && [h("li", { class: "tl-divider" }, "Upcoming"), upcoming.map((t) => item(t, true)), h("li", { class: "tl-divider" }, "History")],
        visible.map((t) => item(t, false)),
        past.length > visible.length && h("li", {},
          h("button", { type: "button", class: "show-more", onclick: () => { showAllTimeline = true; renderTimeline(); } },
            `Show ${past.length - visible.length} older ${past.length - visible.length === 1 ? "item" : "items"}`))));
  }

  // Quick Access resources: account links + defaults for the Type + defaults for all accounts
  function resolvedResources(type) {
    const base = [...(defaults.get("all") || []), ...(defaults.get(typeKey(type)) || [])];
    const own = ownResources || [];
    const byLabel = new Map(own.map((r) => [String(r.label).toLowerCase(), r]));
    const merged = base.map((d) => byLabel.get(String(d.label).toLowerCase()) || d);
    const seen = new Set(merged.map((r) => String(r.label).toLowerCase()));
    return [...merged, ...own.filter((r) => !seen.has(String(r.label).toLowerCase()))];
  }

  function scopeDocId(scope, type) {
    return scope === "account" ? null : scope === "all" ? "all" : typeKey(type);
  }
  function scopeItems(scope, type) {
    if (scope === "account") return ownResources || [];
    return defaults.get(scopeDocId(scope, type)) || [];
  }

  function renderResources() {
    const el = document.getElementById("resources");
    if (!el || !sheet) return;
    const a = sheet.account || null;
    const type = a ? a.Type : null;
    const list = resolvedResources(type);
    const summary = document.getElementById("drawer-summary");
    if (summary) summary.textContent = `Quick facts · ${list.length} ${list.length === 1 ? "resource" : "resources"}`;

    const head = h("div", { class: "section-head" },
      h("span", { class: "eyebrow" }, "Quick access"),
      db && !editor && h("button", { type: "button", class: "link-btn", onclick: () => openEditor("account") }, "Edit links"));

    if (editor) { mount(el, head, editorView(type)); return; }

    mount(el, head,
      list.length
        ? h("ul", { class: "resources" }, list.map((r) => {
            const url = safeUrl(r.url);
            return h("li", {}, url
              ? extLink(url, { class: "resource" }, h("span", {}, r.label), h("span", { class: "arrow", "aria-hidden": "true" }, "↗"))
              : h("span", { class: "resource pending", title: "No link yet. Use Edit links to add one." }, h("span", {}, r.label), h("span", { class: "tag" }, "Pending")));
          }))
        : h("p", { class: "rail-note" }, db ? "No resources yet. Use Edit links to add your POV, one-pagers and case studies." : "Resource links need this page’s shared storage, which isn’t available in this view."));
  }

  function openEditor(scope) {
    const type = sheet.account ? sheet.account.Type : null;
    editor = { scope, rows: scopeItems(scope, type).map((r) => ({ label: r.label || "", url: r.url || "" })), saving: false, error: null };
    if (!editor.rows.length) editor.rows.push({ label: "", url: "" });
    drawerOpen = true;
    renderResources();
  }

  function editorView(type) {
    const typeLabel = type ? `All ${type} accounts` : "All accounts with no Type";
    const scopeSel = h("select", {
      id: "res-scope",
      onchange: (e) => openEditor(e.target.value),
    },
      h("option", { value: "account", selected: editor.scope === "account" }, "This account only"),
      h("option", { value: "type", selected: editor.scope === "type" }, typeLabel),
      h("option", { value: "all", selected: editor.scope === "all" }, "Every account"));

    const rows = editor.rows.map((r, i) => h("div", { class: "row" },
      h("div", {},
        h("input", { id: `res-label-${i}`, placeholder: "Label, e.g. Otoma POV (PDF)", value: r.label, "aria-label": "Link label", oninput: (e) => { r.label = e.target.value; } }),
        h("input", { id: `res-url-${i}`, placeholder: "https://… (leave empty = pending)", value: r.url, "aria-label": "Link URL", oninput: (e) => { r.url = e.target.value; } })),
      h("button", { type: "button", class: "remove", title: "Remove link", "aria-label": "Remove link", onclick: () => { editor.rows.splice(i, 1); renderResources(); } }, "×")));

    return h("div", { class: "editor" },
      h("label", { for: "res-scope" }, "Show these links on", scopeSel),
      rows,
      h("button", { type: "button", class: "link-btn", style: "justify-self:start", onclick: () => { editor.rows.push({ label: "", url: "" }); renderResources(); } }, "+ Add link"),
      editor.scope !== "account" && h("p", { class: "rail-note", style: "margin:0" }, "A link on this account with the same label replaces the shared one here."),
      editor.error && h("div", { class: "err" }, editor.error),
      h("div", { class: "actions" },
        h("button", { type: "button", class: "link-btn", onclick: () => { editor = null; renderResources(); } }, "Cancel"),
        h("button", { type: "button", class: "primary", disabled: editor.saving, onclick: () => saveEditor(type) }, editor.saving ? "Saving…" : "Save links")));
  }

  async function saveEditor(type) {
    const items = [];
    for (const r of editor.rows) {
      const label = r.label.trim();
      if (!label) continue;
      const raw = r.url.trim();
      if (raw && !safeUrl(raw)) { editor.error = `“${raw}” isn’t a web link. Use an https:// address or leave it empty.`; renderResources(); return; }
      items.push({ label: label.slice(0, 120), url: raw ? safeUrl(raw) : "" });
    }
    editor.saving = true; editor.error = null; renderResources();
    const path = editor.scope === "account" ? "resources/" + sheet.id : "resource-defaults/" + scopeDocId(editor.scope, type);
    try {
      await db.doc(path).set({ items, updatedAt: new Date().toISOString() });
      editor = null;
    } catch (err) {
      editor.saving = false;
      editor.error = err && err.code === "invalid_argument" ? "You have view-only access to this page, so links can’t be saved." : "Couldn’t save. Try again.";
    }
    renderResources();
  }

  // ── Render + boot ──────────────────────────────────────────────────────
  function render() {
    applyTheme();
    if (route.view === "sheet") renderSheet();
    else { teardownSheetSubs(); if (outreach.ctl) outreach.ctl.abort(); sheet = null; document.title = "Otoma Account Cheat Sheet"; renderSearch(); }
  }

  readHash();
  render();

  const use = window.claude && typeof window.claude.use === "function" ? window.claude.use.bind(window.claude) : null;
  if (!use) {
    mcpState = "absent"; dbState = "absent"; sampleState = "absent";
    render();
  } else {
    use("mcp").then((m) => {
      mcp = m; mcpState = m ? "ready" : "absent";
      if (route.view === "sheet") { sheet = null; render(); } else { runSearch(); loadDashboard(false); }
    }).catch(() => { mcpState = "absent"; render(); });
    use("sample").then((sm) => {
      sample = sm; sampleState = sm ? "ready" : "absent";
      if (route.view === "sheet") renderOutreach();
    }).catch(() => { sampleState = "absent"; });
    use("db").then((d) => {
      db = d; dbState = d ? "ready" : "absent";
      subscribeDefaults();
      if (d) d.doc("settings/outreach").onSnapshot((snap) => {
        const t = snap.exists && snap.data().context;
        outreachContext = typeof t === "string" && t.trim() ? t : DEFAULT_CONTEXT;
      }, () => {});
      if (route.view === "sheet" && sheet) { subscribeSheetDocs(sheet.id); renderContacts(); renderResources(); }
    }).catch(() => { dbState = "absent"; });
  }
})();
</script>
